<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card source - RowingTools</title>
<!--
  SOURCE OF TRUTH for the social share images in /assets/og/*.png.

  Those PNGs are what the site actually serves; this file is what they were
  rendered from, kept in the repo so a card can be corrected rather than
  recreated from scratch. Some of the copy dates (club counts, regatta counts),
  so expect to come back here.

  PREVIEW:    open scripts/og_cards.html - all cards, stacked and labelled.
  REGENERATE: open scripts/og_cards.html?v=<name> - one card, alone, at exactly
              1200x630 with no margin, then screenshot the viewport at that size
              and save to assets/og/<name>.png.

              Headless, which is how they were made:
                await page.setViewportSize({ width: 1200, height: 630 });
                await page.goto('.../scripts/og_cards.html?v=tracker');
                await page.evaluate(() => document.fonts.ready);
                await page.screenshot({ path: 'assets/og/tracker.png' });

  If the dimensions ever change, the og:image:width / og:image:height meta tags
  on every page have to change with them.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Fraunces:opsz,wght@9..144,900&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#3a3a38;font-family:'Archivo',sans-serif}
  /* One card alone, for screenshotting. No page margin, no chrome. */
  body.solo{background:#0b0b0a}
  body.solo .lab{display:none}
  body.solo .wrap{padding:0;gap:0}
  .wrap{padding:28px;display:flex;flex-direction:column;gap:28px;align-items:flex-start}
  .lab{font-family:'Geist Mono',monospace;font-size:12px;color:#f4f3ef;letter-spacing:.1em;
    text-transform:uppercase;margin-bottom:-16px}

  .card{width:1200px;height:630px;background:#0b0b0a;color:#f4f3ef;
    display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
  .bar{height:9px;background:#c8472b;flex-shrink:0}
  .in{flex:1;padding:62px 76px 56px;display:flex;flex-direction:column;position:relative}
  .mark{font-family:'Fraunces',serif;font-weight:900;font-size:44px;letter-spacing:-0.04em;line-height:1}
  .dot{color:#e8562f}
  .url{font-family:'Geist Mono',monospace;font-size:17px;color:#85857c;letter-spacing:.06em;
    position:absolute;right:76px;top:71px}
  h1{font-size:88px;font-weight:900;font-stretch:118%;letter-spacing:-0.025em;line-height:.98;
    text-transform:uppercase;margin-top:40px}
  .sub{font-family:'Geist Mono',monospace;font-size:23px;color:#a9a9a1;line-height:1.5;
    margin-top:22px;max-width:44ch}
  .rule{height:1px;background:rgba(244,243,239,.30);margin-top:auto}
  svg.motif{margin-top:34px}
  .m{font-family:'Geist Mono',monospace;font-size:19px;fill:#85857c}
  .m.b{fill:#f4f3ef;font-weight:600}
  .m.s{font-size:14px;letter-spacing:.12em}
  .m.r{fill:#e8562f}
  .m.g{fill:#34d399}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>

<script>
// Motifs echo the matching panel on the homepage, so a shared link looks like
// the page it came from. viewBox 640x152.
const MOTIF = {
  scale: `
    <rect x="0" y="34" width="180" height="20" fill="#f87171" opacity=".45"/>
    <rect x="180" y="34" width="120" height="20" fill="#fb923c" opacity=".45"/>
    <rect x="300" y="34" width="104" height="20" fill="#60a5fa" opacity=".45"/>
    <rect x="404" y="34" width="236" height="20" fill="#34d399" opacity=".45"/>
    <rect x="422" y="24" width="7" height="40" fill="#e8562f"/>
    <text x="0" y="86" class="m">60%</text>
    <text x="180" y="86" class="m">72%</text>
    <text x="300" y="86" class="m">80%</text>
    <text x="404" y="86" class="m">87%</text>
    <text x="640" y="86" class="m" text-anchor="end">100%</text>
    <text x="0" y="16" class="m s">2000m TIME SCORED AGAINST WORLD BEST</text>`,
  heat: `
    <text x="0" y="30" class="m">Ch 8+</text><text x="0" y="62" class="m">W 4x</text>
    <text x="0" y="94" class="m">Op 2-</text><text x="0" y="126" class="m">J18 8+</text>
    <g opacity=".6">
      <rect x="86" y="14" width="86" height="22" fill="#34d399"/><rect x="178" y="14" width="86" height="22" fill="#34d399"/><rect x="270" y="14" width="86" height="22" fill="#60a5fa"/><rect x="362" y="14" width="86" height="22" fill="#60a5fa"/><rect x="454" y="14" width="86" height="22" fill="#fb923c"/><rect x="546" y="14" width="86" height="22" fill="#f87171"/>
      <rect x="86" y="46" width="86" height="22" fill="#34d399"/><rect x="270" y="46" width="86" height="22" fill="#60a5fa"/><rect x="362" y="46" width="86" height="22" fill="#fb923c"/><rect x="454" y="46" width="86" height="22" fill="#fb923c"/><rect x="546" y="46" width="86" height="22" fill="#f87171"/>
      <rect x="86" y="78" width="86" height="22" fill="#60a5fa"/><rect x="178" y="78" width="86" height="22" fill="#60a5fa"/><rect x="270" y="78" width="86" height="22" fill="#60a5fa"/><rect x="362" y="78" width="86" height="22" fill="#fb923c"/><rect x="454" y="78" width="86" height="22" fill="#f87171"/>
      <rect x="86" y="110" width="86" height="22" fill="#34d399"/><rect x="178" y="110" width="86" height="22" fill="#60a5fa"/><rect x="270" y="110" width="86" height="22" fill="#fb923c"/><rect x="362" y="110" width="86" height="22" fill="#fb923c"/><rect x="454" y="110" width="86" height="22" fill="#f87171"/><rect x="546" y="110" width="86" height="22" fill="#f87171"/>
    </g>
    <rect x="178" y="46" width="86" height="22" fill="#34d399"/>
    <rect x="179" y="47" width="84" height="20" fill="none" stroke="#f4f3ef" stroke-width="2"/>`,
  clubs: `
    <text x="0" y="14" class="m s">#</text><text x="46" y="14" class="m s">CLUB</text>
    <text x="470" y="14" class="m s" text-anchor="end">ENTRIES</text>
    <text x="640" y="14" class="m s" text-anchor="end">TOP-10 AVG</text>
    <line x1="0" y1="26" x2="640" y2="26" stroke="#f4f3ef" stroke-width="1.5" opacity=".8"/>
    <text x="0" y="58" class="m">1</text><text x="46" y="58" class="m b">London</text><text x="470" y="58" class="m" text-anchor="end">108</text><text x="640" y="58" class="m g" text-anchor="end">93.6%</text>
    <line x1="0" y1="72" x2="640" y2="72" stroke="#f4f3ef" stroke-width="1" opacity=".12"/>
    <text x="0" y="104" class="m">2</text><text x="46" y="104" class="m b">Thames</text><text x="470" y="104" class="m" text-anchor="end">111</text><text x="640" y="104" class="m g" text-anchor="end">93.5%</text>
    <line x1="0" y1="118" x2="640" y2="118" stroke="#f4f3ef" stroke-width="1" opacity=".12"/>
    <text x="0" y="150" class="m">3</text><text x="46" y="150" class="m b">Leander</text><text x="470" y="150" class="m" text-anchor="end">49</text><text x="640" y="150" class="m g" text-anchor="end">92.6%</text>`,
  henley: `
    <text x="0" y="16" class="m s">SUN 14:20 &#183; GOBLETS &#183; FINAL</text>
    <text x="0" y="58" class="m b" style="font-size:30px">Marlow &amp; Leander</text>
    <text x="0" y="92" class="m">bt Nautilus &#183; 1&#190; lengths</text>
    <text x="0" y="134" class="m b">07:17</text><text x="96" y="134" class="m r">94.7% of course record</text>
    <line x1="430" y1="4" x2="430" y2="146" stroke="#f4f3ef" stroke-width="1" opacity=".14"/>
    <text x="466" y="70" class="m b" style="font-size:26px">8 km/h tail</text>
    <text x="466" y="106" class="m">21&#176;C &#183; sunny</text>`,
  tracker: `
    <text x="0" y="14" class="m s">THU 27 AUG</text>
    <line x1="0" y1="26" x2="380" y2="26" stroke="#f4f3ef" stroke-width="1.5" opacity=".8"/>
    <text x="0" y="58" class="m b">Back Squat</text><text x="150" y="58" class="m">3 &#215; 8</text><text x="380" y="58" class="m r" text-anchor="end">112.5kg</text>
    <line x1="0" y1="72" x2="380" y2="72" stroke="#f4f3ef" stroke-width="1" opacity=".12"/>
    <text x="0" y="104" class="m b">Erg</text><text x="60" y="104" class="m">9,500m</text><text x="380" y="104" class="m" text-anchor="end">1:49.2/500m</text>
    <line x1="0" y1="118" x2="380" y2="118" stroke="#f4f3ef" stroke-width="1" opacity=".12"/>
    <text x="0" y="150" class="m b">Core</text><text x="70" y="150" class="m">4:13 working</text>
    <line x1="436" y1="0" x2="436" y2="150" stroke="#f4f3ef" stroke-width="1" opacity=".14"/>
    <text x="466" y="16" class="m s">KM A WEEK</text><text x="640" y="16" class="m r s" text-anchor="end">35.5</text>
    <g fill="#e8562f">
      <rect x="466" y="86" width="22" height="52" opacity=".42"/>
      <rect x="496" y="60" width="22" height="78" opacity=".42"/>
      <rect x="526" y="72" width="22" height="66" opacity=".42"/>
      <rect x="556" y="104" width="22" height="34" opacity=".42"/>
      <rect x="586" y="50" width="22" height="88" opacity=".42"/>
      <rect x="616" y="34" width="22" height="104"/>
    </g>
    <line x1="466" y1="138" x2="640" y2="138" stroke="#f4f3ef" stroke-width="1" opacity=".3"/>`,
};

// Counts in these subtitles date. Check them against the live site before
// regenerating: "311 clubs" and "13 UK regattas" are the ones that move.
const VARIANTS = [
  { file: 'default',      title: 'GMT% Analysis',        sub: 'Free tools for making sense of UK club rowing', motif: 'scale' },
  { file: 'gmt',          title: 'GMT% Calculator',      sub: 'Score a 2000m time against World Best, Met and Henley benchmarks', motif: 'scale' },
  { file: 'leaderboards', title: 'Regatta Leaderboards', sub: 'Every crew at 13 UK regattas, ranked and heatmapped by GMT%', motif: 'heat' },
  { file: 'regatta',      title: 'Regatta Results',      sub: 'GMT% analysis, club rankings and top performers, event by event', motif: 'heat' },
  { file: 'clubs',        title: 'Club Profiles',        sub: 'Leaderboard and performance profiles for 311 UK rowing clubs', motif: 'clubs' },
  { file: 'henley',       title: 'Henley Royal Regatta', sub: 'Crews ranked by percentage of the course record, with 500m splits', motif: 'henley' },
  { file: 'tracker',      title: 'Training Tracker',     sub: 'Erg, weights and core progress, shared with your squad', motif: 'tracker' },
];

const card = v => `
  <div class="card">
    <div class="bar"></div>
    <div class="in">
      <div class="mark">Rowing<span class="dot">.</span>Tools</div>
      <div class="url">rowingtools.co.uk</div>
      <h1>${v.title}</h1>
      <div class="sub">${v.sub}</div>
      <div class="rule"></div>
      <svg class="motif" width="640" height="152" viewBox="0 0 640 152">${MOTIF[v.motif]}</svg>
    </div>
  </div>`;

const only = new URLSearchParams(location.search).get('v');
const show = only ? VARIANTS.filter(v => v.file === only) : VARIANTS;
if (only) document.body.classList.add('solo');
document.getElementById('wrap').innerHTML = show.length
  ? show.map(v => (only ? '' : `<div class="lab">assets/og/${v.file}.png</div>`) + card(v)).join('')
  : `<div class="lab">No card named "${only}". Try: ${VARIANTS.map(v => v.file).join(', ')}</div>`;
</script>
</body>
</html>
